services:
  mariadb_asociacion:
    image: mariadb:10.11
    container_name: mariadb_asociacion_juegos
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: asociacion_juegos
      MYSQL_USER: user_asociacion
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/data.sql:/docker-entrypoint-initdb.d/02_data.sql
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: